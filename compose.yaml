services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: scopefree
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env file}
      POSTGRES_DB: scopefree
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scopefree_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopefree -d scopefree"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  scopefree_pg:
